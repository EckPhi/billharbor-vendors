name: Publish synthetic vendor store

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Positive store revision, strictly greater than every previously published revision'
        required: true
        type: string
      lifetime_days:
        description: 'Index validity in days (1–90); renewal requires another manual run and trust review'
        required: true
        default: '90'
        type: string

permissions:
  contents: read

concurrency:
  group: vendor-store-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact reviewed release assets and construct retained site
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_REPOSITORY: ${{ github.repository }}
          STORE_OWNER: ${{ github.repository_owner }}
          STORE_NAME: ${{ github.event.repository.name }}
          STORE_REVISION: ${{ inputs.revision }}
          STORE_LIFETIME: ${{ inputs.lifetime_days }}
        run: |
          python3 tools/build_pages_store.py \
            --download-repository "$STORE_REPOSITORY" \
            --wheels "$RUNNER_TEMP/reviewed-wheels" \
            --output "$RUNNER_TEMP/vendor-store" \
            --base-url "https://${STORE_OWNER,,}.github.io/$STORE_NAME" \
            --revision "$STORE_REVISION" --lifetime-days "$STORE_LIFETIME" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload complete public site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/vendor-store

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed public store
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
