name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  github-release:
    name: Build GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Require an immutable BillHarbor ref
        env:
          BILLHARBOR_REF: ${{ vars.BILLHARBOR_REF }}
        run: '[[ "$BILLHARBOR_REF" =~ ^[0-9a-f]{40}$ ]]'

      - name: Check out tagged catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: billharbor-vendors

      - name: Check out pinned private BillHarbor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EckPhi/billharbor
          ref: ${{ vars.BILLHARBOR_REF }}
          token: ${{ secrets.BILLHARBOR_READ_TOKEN }}
          path: billharbor
          persist-credentials: false

      - name: Verify checked-out BillHarbor revision
        env:
          BILLHARBOR_REF: ${{ vars.BILLHARBOR_REF }}
        run: test "$(git -C billharbor rev-parse HEAD)" = "$BILLHARBOR_REF"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.7.19"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: billharbor-vendors/uv.lock

      - name: Match tag to package version
        working-directory: billharbor-vendors
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Test frozen catalog
        working-directory: billharbor-vendors
        run: |
          uv sync --frozen --group test
          # CI-only browser environment; exact reviewed engine browser pins.
          uv pip install --python .venv/bin/python playwright==1.63.0 greenlet==3.5.6 pyee==13.0.1
          .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python -m pytest -q --junitxml="$RUNNER_TEMP/catalog-tests.xml"
          python - <<'PYTEST_REPORT'
          import os
          import xml.etree.ElementTree as ET
          report = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "catalog-tests.xml"))
          assert sum(int(s.get("skipped", 0)) for s in report.iter("testsuite")) == 0, "Browser verification must not skip tests"
          PYTEST_REPORT

      - name: Build and verify release wheels
        env:
          BILLHARBOR_REF: ${{ vars.BILLHARBOR_REF }}
          DIST_DIR: ${{ runner.temp }}/dists
        run: |
          uv build --wheel --out-dir "$DIST_DIR" billharbor
          uv build --wheel --out-dir "$DIST_DIR" billharbor-vendors
          uv run --no-project --isolated \
            --with "$DIST_DIR"/billharbor-*.whl \
            --with "$DIST_DIR"/billharbor_vendors-*.whl \
            python -c 'from importlib.resources import files; from billharbor.validation import validate_manifest; from amazon_business_de.connector import Connector as A; from oekostrom_at.connector import Connector as O; validate_manifest(files("billharbor_vendors").joinpath("data/oekostrom_at.toml").read_bytes()); A(); O(); validate_manifest(files("billharbor_vendors").joinpath("data/oekostrom_browser_synthetic.toml").read_bytes()); from oekostrom_at.browser import BrowserConnector; from oekostrom_at.identity import source_id; assert source_id("installation", "invented", "invoice", "Invented label").startswith("oekostrom_label_v1_")'
          sha256sum "$DIST_DIR"/billharbor_vendors-*.whl > "$DIST_DIR"/SHA256SUMS
          ENGINE_DIGEST=$(sha256sum "$DIST_DIR"/billharbor-*.whl | cut -d ' ' -f 1)
          printf 'repository=EckPhi/billharbor\ncommit=%s\nwheel_sha256=%s\n' "$BILLHARBOR_REF" "$ENGINE_DIGEST" > "$DIST_DIR"/BILLHARBOR-SDK

      - name: Publish immutable GitHub release assets
        working-directory: billharbor-vendors
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_DIR: ${{ runner.temp }}/dists
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          RELEASE_FLAGS=(--verify-tag --generate-notes)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" "$DIST_DIR"/billharbor_vendors-*.whl "$DIST_DIR"/SHA256SUMS "$DIST_DIR"/BILLHARBOR-SDK "${RELEASE_FLAGS[@]}"
