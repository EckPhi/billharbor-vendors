name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  github-release:
    name: Build GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Require an immutable BillHarbor ref
        env:
          BILLHARBOR_REF: ${{ vars.BILLHARBOR_REF }}
        run: '[[ "$BILLHARBOR_REF" =~ ^[0-9a-f]{40}$ ]]'

      - name: Check out tagged catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: billharbor-vendors

      - name: Check out pinned private BillHarbor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EckPhi/billharbor
          ref: ${{ vars.BILLHARBOR_REF }}
          token: ${{ secrets.BILLHARBOR_READ_TOKEN }}
          path: billharbor
          persist-credentials: false

      - name: Verify checked-out BillHarbor revision
        env:
          BILLHARBOR_REF: ${{ vars.BILLHARBOR_REF }}
        run: test "$(git -C billharbor rev-parse HEAD)" = "$BILLHARBOR_REF"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.7.19"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: billharbor-vendors/uv.lock

      - name: Match tag to package version
        working-directory: billharbor-vendors
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Test frozen catalog
        working-directory: billharbor-vendors
        run: uv run --frozen --group test pytest -q

      - name: Build and verify release wheels
        env:
          BILLHARBOR_REF: ${{ vars.BILLHARBOR_REF }}
          DIST_DIR: ${{ runner.temp }}/dists
        run: |
          uv build --wheel --out-dir "$DIST_DIR" billharbor
          uv build --wheel --out-dir "$DIST_DIR" billharbor-vendors
          uv run --no-project --isolated \
            --with "$DIST_DIR"/billharbor-*.whl \
            --with "$DIST_DIR"/billharbor_vendors-*.whl \
            python -c 'from importlib.resources import files; from billharbor.validation import validate_manifest; from amazon_business_de.connector import Connector as A; from oekostrom_at.connector import Connector as O; validate_manifest(files("billharbor_vendors").joinpath("data/oekostrom_at.toml").read_bytes()); A(); O()'
          sha256sum "$DIST_DIR"/billharbor_vendors-*.whl > "$DIST_DIR"/SHA256SUMS
          ENGINE_DIGEST=$(sha256sum "$DIST_DIR"/billharbor-*.whl | cut -d ' ' -f 1)
          printf 'repository=EckPhi/billharbor\ncommit=%s\nwheel_sha256=%s\n' "$BILLHARBOR_REF" "$ENGINE_DIGEST" > "$DIST_DIR"/BILLHARBOR-SDK

      - name: Publish immutable GitHub release assets
        working-directory: billharbor-vendors
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_DIR: ${{ runner.temp }}/dists
        run: gh release create "$GITHUB_REF_NAME" "$DIST_DIR"/billharbor_vendors-*.whl "$DIST_DIR"/SHA256SUMS "$DIST_DIR"/BILLHARBOR-SDK --verify-tag --generate-notes
