name: Release

on:
  push:
    branches: [develop, main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: vendor-store-pages
  cancel-in-progress: false
  queue: max

jobs:
  github-release:
    name: Build GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out tagged catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: billharbor-vendors

      - name: Resolve immutable release identity
        id: release
        working-directory: billharbor-vendors
        env:
          PUSH_REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 tools/release_context.py --ref "$PUSH_REF" --run-number "$RUN_NUMBER" --attempt "$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Read reviewed SDK source revision
        id: sdk_ref
        shell: bash
        run: |
          REF_FILE=billharbor-vendors/.github/billharbor-sdk-ref
          test -f "$REF_FILE" || { echo "Missing reviewed SDK source-ref file" >&2; exit 1; }
          BILLHARBOR_REF=$(cat "$REF_FILE")
          [[ "$BILLHARBOR_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "SDK source ref must be one immutable 40-character SHA" >&2; exit 1; }
          printf 'ref=%s\n' "$BILLHARBOR_REF" >> "$GITHUB_OUTPUT"

      - name: Check out pinned private BillHarbor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EckPhi/billharbor
          ref: ${{ steps.sdk_ref.outputs.ref }}
          token: ${{ secrets.BILLHARBOR_READ_TOKEN }}
          path: billharbor
          persist-credentials: false

      - name: Verify checked-out BillHarbor revision
        env:
          BILLHARBOR_REF: ${{ steps.sdk_ref.outputs.ref }}
        run: test "$(git -C billharbor rev-parse HEAD)" = "$BILLHARBOR_REF"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.7.19"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: billharbor-vendors/uv.lock

      - name: Derive aggregate package version from release tag
        working-directory: billharbor-vendors
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: python tools/prepare_release.py "$RELEASE_TAG"

      - name: Test frozen catalog
        working-directory: billharbor-vendors
        run: |
          uv sync --frozen --group test
          # CI-only browser environment; exact reviewed engine browser pins.
          uv pip install --python .venv/bin/python playwright==1.63.0 greenlet==3.5.6 pyee==13.0.1
          .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python -m pytest -q --junitxml="$RUNNER_TEMP/catalog-tests.xml"
          python - <<'PYTEST_REPORT'
          import os
          import xml.etree.ElementTree as ET
          report = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "catalog-tests.xml"))
          assert sum(int(s.get("skipped", 0)) for s in report.iter("testsuite")) == 0, "Browser verification must not skip tests"
          PYTEST_REPORT

      - name: Build and verify release wheels
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          BILLHARBOR_REF: ${{ steps.sdk_ref.outputs.ref }}
          DIST_DIR: ${{ runner.temp }}/dists
        run: |
          uv build --wheel --out-dir "$DIST_DIR" billharbor/packages/connector-sdk
          uv build --wheel --out-dir "$DIST_DIR" billharbor-vendors/vendors/billharbor_synthetic
          uv run --no-project --with hatchling==1.32.0 python billharbor-vendors/tools/build_vendor_plugins.py --version "${RELEASE_TAG#v}" --output-dir "$DIST_DIR"
          uv build --wheel --out-dir "$DIST_DIR" billharbor-vendors
          python - <<'PYVERSION'
          import ast
          import email.parser
          import os
          import pathlib
          import zipfile
          wheels = list(pathlib.Path(os.environ["DIST_DIR"]).glob("billharbor_vendors-*.whl"))
          assert len(wheels) == 1, "Expected one aggregate wheel"
          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_files = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              assert len(metadata_files) == 1
              metadata = email.parser.Parser().parsestr(archive.read(metadata_files[0]).decode())
              source = ast.parse(archive.read("billharbor_vendors/__init__.py").decode())
              exported = [ast.literal_eval(node.value) for node in source.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)]
              assert exported == [os.environ["RELEASE_TAG"][1:]]
          assert metadata["Version"] == os.environ["RELEASE_TAG"][1:]
          PYVERSION
          # uv isolates packages; Python -I also excludes checkout/PYTHONPATH imports.
          uv run --no-project --isolated \
            --with "$DIST_DIR"/billharbor_connector_sdk-*.whl \
            --with "$DIST_DIR"/billharbor_synthetic-*.whl \
            --with "$DIST_DIR"/billharbor_vendors-*.whl \
            python -I -c 'from importlib.resources import files; from billharbor_sdk.validation import validate_manifest; from amazon_business_de.connector import Connector as A; from oekostrom_at.connector import Connector as O; validate_manifest(files("billharbor_vendors").joinpath("data/oekostrom_at.toml").read_bytes()); A(); O(); validate_manifest(files("billharbor_vendors").joinpath("data/oekostrom_browser_synthetic.toml").read_bytes()); from oekostrom_at.browser import BrowserConnector; from oekostrom_at.identity import source_id; assert source_id("installation", "invented", "invoice", "Invented label").startswith("oekostrom_label_v1_")'
          sha256sum "$DIST_DIR"/*.whl > "$DIST_DIR"/SHA256SUMS
          ENGINE_DIGEST=$(sha256sum "$DIST_DIR"/billharbor_connector_sdk-*.whl | cut -d ' ' -f 1)
          printf 'repository=EckPhi/billharbor\ncommit=%s\nwheel_sha256=%s\n' "$BILLHARBOR_REF" "$ENGINE_DIGEST" > "$DIST_DIR"/BILLHARBOR-SDK

      - name: Verify four installed fixture plugins without application or catalog
        env:
          DIST_DIR: ${{ runner.temp }}/dists
        run: |
          uv run --no-project --isolated \
            --with "$DIST_DIR"/billharbor_connector_sdk-*.whl \
            --with "$DIST_DIR"/billharbor_drei_at-*.whl \
            --with "$DIST_DIR"/billharbor_lidl_connect_at-*.whl \
            --with "$DIST_DIR"/billharbor_netcup-*.whl \
            --with "$DIST_DIR"/billharbor_hornbach_at-*.whl \
            python -I billharbor-vendors/tools/verify_vendor_plugins.py

      - name: Verify standalone reference plugin without application or catalog
        env:
          DIST_DIR: ${{ runner.temp }}/dists
        run: |
          # uv isolates packages; Python -I also excludes checkout/PYTHONPATH imports.
          uv run --no-project --isolated \
            --with "$DIST_DIR"/billharbor_connector_sdk-*.whl \
            --with "$DIST_DIR"/billharbor_synthetic-*.whl \
            python -I - <<'PYPLUGIN'
          import asyncio
          from importlib.util import find_spec
          from importlib.resources import files
          from billharbor_sdk.validation import validate_manifest
          from billharbor_synthetic.connector import create_connector
          assert find_spec("billharbor") is None
          assert find_spec("billharbor_vendors") is None
          manifest = validate_manifest(files("billharbor_synthetic").joinpath("data/vendor.toml").read_bytes())
          assert manifest["id"] == "billharbor_synthetic"
          async def verify():
              connector = await create_connector({}, lambda: None)
              assert connector.capabilities().connector_id == manifest["id"]
              await connector.close()
          asyncio.run(verify())
          PYPLUGIN

      - name: Publish immutable GitHub release assets
        working-directory: billharbor-vendors
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_DIR: ${{ runner.temp }}/dists
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          RELEASE_SHA: ${{ github.sha }}
          PUSH_REF: ${{ github.ref }}
        run: |
          SEQUENCE=$((GITHUB_RUN_ID * 1000 + GITHUB_RUN_ATTEMPT))
          RELEASE_FLAGS=(--generate-notes --target "$RELEASE_SHA")
          if [[ "$PUSH_REF" == refs/tags/* ]]; then RELEASE_FLAGS+=(--verify-tag); fi
          if [[ "$PRERELEASE" == true ]]; then RELEASE_FLAGS+=(--prerelease --latest=false); else RELEASE_FLAGS+=(--latest); fi
          python3 tools/channel_store.py ledger --tag "$RELEASE_TAG" --channel "$CHANNEL" --sequence "$SEQUENCE" --wheels "$DIST_DIR" --output "$DIST_DIR/store-release.json"
          gh release create "$RELEASE_TAG" "$DIST_DIR"/*.whl "$DIST_DIR"/SHA256SUMS "$DIST_DIR"/BILLHARBOR-SDK "$DIST_DIR"/store-release.json "${RELEASE_FLAGS[@]}"

      - name: Reconstruct all retained channel stores from release ledgers
        working-directory: billharbor-vendors
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_REPOSITORY: ${{ github.repository }}
          STORE_OWNER: ${{ github.repository_owner }}
          STORE_NAME: ${{ github.event.repository.name }}
        run: |
          python3 tools/channel_store.py site --repository "$STORE_REPOSITORY" --wheels "$RUNNER_TEMP/retained-wheels" --output "$RUNNER_TEMP/vendor-store" --base-url "https://${STORE_OWNER,,}.github.io/$STORE_NAME"
          find "$RUNNER_TEMP/vendor-store" -name index.sha256 -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"
      - name: Upload complete public store
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/vendor-store
      - name: Deploy channel stores
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
