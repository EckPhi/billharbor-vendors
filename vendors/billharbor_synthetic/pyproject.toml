[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "billharbor-synthetic"
version = "0.1.0.dev0"
description = "Invented offline reference vendor plugin for BillHarbor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = ["billharbor-connector-sdk==0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/billharbor_synthetic"]

[tool.hatch.build.targets.wheel.force-include]
"vendor.toml" = "billharbor_synthetic/data/vendor.toml"

[tool.uv.sources]
billharbor-connector-sdk = { path = "../../../billharbor/packages/connector-sdk" }
