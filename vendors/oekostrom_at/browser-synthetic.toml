schema = "vendor-definition/2"
id = "oekostrom_at"
display_name = "oekostrom.at"
vendor_site = "https://oekostrom.at/"
version = "0.6.0"
status = "synthetic_verified"
entrypoint = "oekostrom_at.connector:create_connector"
sdk = ">=2,<3"
maintainer = "BillHarbor catalog maintainers"
license = "Apache-2.0"

[compatibility]
sdk = ">=2,<3"
engine = ">=0.5.0.dev0,<0.6"
python = ">=3.11"
wire_adapters = ["document-delivery/1"]

[coverage]
countries = ["AT"]
locales = ["de-AT"]
timezone = "Europe/Vienna"
account_types = ["customer"]
document_kinds = ["invoice"]
known_exclusions = [
  "Invented .test portal only; no real Oekostrom origin, selector or identity is reviewed",
  "deposit (Kaution) rows are skipped and never downloaded; installment (Teilbetragsrechnung) and annual (Abrechnung) bills are invoices",
  "credit_note rows are skipped and never downloaded",
  "settlement rows are skipped and never downloaded",
  "PV feed-in settlement rows are skipped and never downloaded",
]

[transport]
preferred = "browser"
supported = ["browser"]
selection_rules = "Broker-owned browser-rpc/1 only; the plugin never launches a browser or opens network connections"

[network]
origins = ["https://portal.oekostrom-invented.test"]
redirect_origins = ["https://portal.oekostrom-invented.test"]
methods = ["GET", "POST"]
redirect_policy = "The gateway rejects every 3xx response; only the exact invented HTTPS origin on port 443 is reachable"

[authentication]
mode = "interactive_or_secret_bundle"
secret_fields = ["username", "password"]
session_scope = "account"
manual_challenges = ["mfa", "captcha", "session_expired"]

[account_hierarchy]
scope_kind = "installation"
enumeration = "Enumerate invented installations from the combined document view"
selection = "Every run uses an explicitly selected installation"

[discovery]
scope_kind = "installation"
date_basis = "issue_date"
date_inclusivity = "inclusive"
pagination = "page"
ordering = "invented_stable_order"
empty_result_semantics = "terminal_when_scope_and_pagination_verified"

[document_identity]
native_id = "Operator-selected exact Bezeichnung surrogate; not printed invoice number"
scope = "Account, installation or contract, type and issuer as required"
revision_policy = "conflict_on_changed_bytes"
encoding = "oekostrom-label/1 JSON tuple SHA-256; exact label text without normalization"

[download]
formats = ["application/pdf"]
mechanism = "Broker download of the original invoice PDF control; returned bytes are bounded and signature-checked"
validation = "Validate PDF signature and per-document byte limit on returned bytes"
original_policy = "Preserve vendor originals"

[metadata]
observations = ["issue_date"]
provenance = "Each observation retains field path and observation time"
issuer_evidence = "Portal identity does not prove legal issuer"

[limits]
concurrent_sessions_per_account = 1
maximum_documents_per_page = 2
maximum_requests = 500
maximum_pages = 50
maximum_documents = 100
maximum_document_bytes = 20971520
maximum_total_bytes = 104857600
maximum_execution_seconds = 300

[interaction]
detectors = ["mfa", "captcha", "session_expired", "portal_drift"]
pause_policy = "Pause with bounded lease and explicit expiry"
permitted_human_actions = ["Complete login in the same isolated browser"]
maximum_wait_seconds = 120

[diagnostics]
capture_default = "off"
safe_counters = ["requests", "pages", "discovered", "downloaded", "rejected"]

[verification]
fixture_set = "package:oekostrom_at/data/fixture.json"
live_verified = false
known_gaps = ["Real origins", "selectors", "pagination", "native identity", "date semantics", "login/challenge flow"]
drift_indicators = ["Unexpected empty page", "Selector mismatch", "New pagination control", "Row changed since discovery", "HTML returned for PDF"]
recovery_instructions = "Stop safely; do not guess selectors or undocumented APIs"
